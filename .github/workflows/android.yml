name: Build Momin Chat Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Firebase configuration
        shell: bash
        run: |
          test -f google-services.json
          mkdir -p app
          cp google-services.json app/google-services.json

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/momin/chat
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MominChat"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.momin.chat'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.momin.chat'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '1.3'
              }

              signingConfigs {
                  stable {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Momin Chat</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".ChatActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/momin/chat/MainActivity.java <<'EOF'
          package com.momin.chat;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInClient;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;
          import com.google.firebase.auth.AuthCredential;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.GoogleAuthProvider;

          public class MainActivity extends Activity {
              private static final int RC_SIGN_IN = 9001;
              private FirebaseAuth auth;
              private GoogleSignInClient googleClient;
              private TextView status;
              private Button loginButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
                  getWindow().setStatusBarColor(Color.rgb(7, 94, 84));
                  getWindow().setNavigationBarColor(Color.rgb(7, 94, 84));

                  auth = FirebaseAuth.getInstance();

                  if (auth.getCurrentUser() != null) {
                      openChat();
                      return;
                  }

                  GoogleSignInOptions options =
                      new GoogleSignInOptions.Builder(
                          GoogleSignInOptions.DEFAULT_SIGN_IN
                      )
                      .requestIdToken(
                          getString(R.string.default_web_client_id)
                      )
                      .requestEmail()
                      .build();

                  googleClient = GoogleSignIn.getClient(this, options);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(32, 32, 32, 32);
                  layout.setBackgroundColor(Color.rgb(245, 247, 248));

                  TextView title = new TextView(this);
                  title.setText("Momin Chat");
                  title.setTextSize(30);
                  title.setTextColor(Color.rgb(7, 94, 84));
                  title.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("Sign in to get started");
                  status.setTextSize(16);
                  status.setTextColor(Color.DKGRAY);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 24, 0, 24);

                  loginButton = new Button(this);
                  loginButton.setText("Continue with Google");
                  loginButton.setOnClickListener(v -> signIn());

                  layout.addView(title);
                  layout.addView(status);
                  layout.addView(loginButton);
                  setContentView(layout);
              }

              private void signIn() {
                  loginButton.setEnabled(false);
                  status.setText("Opening Google sign-in...");
                  startActivityForResult(
                      googleClient.getSignInIntent(), RC_SIGN_IN
                  );
              }

              @Override
              protected void onActivityResult(
                  int requestCode, int resultCode, Intent data
              ) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != RC_SIGN_IN) return;

                  try {
                      GoogleSignInAccount account =
                          GoogleSignIn.getSignedInAccountFromIntent(data)
                              .getResult(ApiException.class);

                      if (account == null || account.getIdToken() == null) {
                          showError("Google ID token missing.");
                          return;
                      }

                      AuthCredential credential =
                          GoogleAuthProvider.getCredential(
                              account.getIdToken(), null
                          );

                      auth.signInWithCredential(credential)
                          .addOnCompleteListener(this, task -> {
                              if (task.isSuccessful()) {
                                  openChat();
                              } else {
                                  showError("Firebase sign-in failed.");
                              }
                          });
                  } catch (Exception e) {
                      showError("Sign-in failed. Please try again.");
                  }
              }

              private void showError(String message) {
                  status.setText(message);
                  loginButton.setEnabled(true);
              }

              private void openChat() {
                  startActivity(new Intent(this, ChatActivity.class));
                  finish();
              }
          }
          EOF

          cat > app/src/main/java/com/momin/chat/ChatActivity.java <<'EOF'
          package com.momin.chat;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.FirebaseUser;
          import com.google.firebase.firestore.DocumentSnapshot;
          import com.google.firebase.firestore.FieldValue;
          import com.google.firebase.firestore.FirebaseFirestore;
          import com.google.firebase.firestore.ListenerRegistration;
          import com.google.firebase.firestore.Query;

          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Map;

          public class ChatActivity extends Activity {
              private FirebaseFirestore db;
              private FirebaseUser me;
              private LinearLayout content;
              private ListenerRegistration messageListener;
              private String activeChatId;
              private String activePeerName;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
                  getWindow().setStatusBarColor(Color.rgb(7, 94, 84));
                  getWindow().setNavigationBarColor(Color.rgb(7, 94, 84));

                  me = FirebaseAuth.getInstance().getCurrentUser();
                  if (me == null) {
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                      return;
                  }

                  db = FirebaseFirestore.getInstance();
                  showBaseScreen();
                  registerProfile();
                  showUsers();
              }

              private void showBaseScreen() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(245, 247, 248));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(12, 6, 6, 6);
                  header.setBackgroundColor(Color.rgb(7, 94, 84));

                  TextView title = new TextView(this);
                  title.setText("Momin Chat");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);

                  Button signOut = new Button(this);
                  signOut.setText("Sign out");
                  signOut.setOnClickListener(v -> {
                      if (messageListener != null) messageListener.remove();
                      FirebaseAuth.getInstance().signOut();
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                  });

                  header.addView(title, new LinearLayout.LayoutParams(
                      0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  header.addView(signOut);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(12, 12, 12, 12);
                  scroll.addView(content);

                  root.addView(header);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));
                  setContentView(root);
              }

              private void registerProfile() {
                  Map<String, Object> profile = new HashMap<>();
                  String name = me.getDisplayName();
                  if (name == null || name.trim().isEmpty()) {
                      name = "Momin Chat user";
                  }
                  profile.put("displayName", name);
                  profile.put("uid", me.getUid());

                  // Google email is not stored in this profile.
                  db.collection("users").document(me.getUid())
                      .set(profile)
                      .addOnFailureListener(e ->
                          toast("Profile save failed. Check Firestore Rules."));
              }

              private void showUsers() {
                  content.removeAllViews();

                  TextView heading = new TextView(this);
                  heading.setText("Users");
                  heading.setTextSize(22);
                  heading.setTextColor(Color.rgb(7, 94, 84));
                  content.addView(heading);

                  TextView info = new TextView(this);
                  info.setText("Choose a user to open a private chat.");
                  content.addView(info);

                  db.collection("users").get()
                      .addOnSuccessListener(snapshot -> {
                          if (isFinishing()) return;
                          boolean found = false;

                          for (DocumentSnapshot doc : snapshot.getDocuments()) {
                              if (doc.getId().equals(me.getUid())) continue;

                              String peerName = doc.getString("displayName");
                              if (peerName == null || peerName.trim().isEmpty()) {
                                  peerName = "Momin Chat user";
                              }

                              Button userButton = new Button(this);
                              userButton.setText(peerName);
                              String peerId = doc.getId();
                              String finalName = peerName;
                              userButton.setOnClickListener(v ->
                                  openPrivateChat(peerId, finalName));
                              content.addView(userButton);
                              found = true;
                          }

                          if (!found) {
                              TextView empty = new TextView(this);
                              empty.setText(
                                  "No other users yet. Ask another user to sign in."
                              );
                              empty.setPadding(0, 20, 0, 20);
                              content.addView(empty);
                          }
                      })
                      .addOnFailureListener(e ->
                          toast("Could not load users. Check Firestore Rules."));
              }

              private String chatIdFor(String otherUid) {
                  String a = me.getUid();
                  String b = otherUid;
                  if (a.compareTo(b) > 0) {
                      String temp = a;
                      a = b;
                      b = temp;
                  }
                  return a + "_" + b;
              }

              private void openPrivateChat(String peerId, String peerName) {
                  activePeerName = peerName;
                  activeChatId = chatIdFor(peerId);

                  Map<String, Object> chat = new HashMap<>();
                  chat.put("participants", Arrays.asList(me.getUid(), peerId));

                  db.collection("chats").document(activeChatId).get()
                      .continueWithTask(task -> {
                          if (!task.isSuccessful()) throw task.getException();
                          if (!task.getResult().exists()) {
                              return db.collection("chats").document(activeChatId)
                                  .set(chat);
                          }
                          return com.google.android.gms.tasks.Tasks.forResult(null);
                      })
                      .addOnSuccessListener(v -> showPrivateChat())
                      .addOnFailureListener(e ->
                          toast("Could not open chat. Check Firestore Rules."));
              }

              private void showPrivateChat() {
                  if (messageListener != null) messageListener.remove();
                  content.removeAllViews();

                  Button back = new Button(this);
                  back.setText("Back to users");
                  back.setOnClickListener(v -> {
                      if (messageListener != null) {
                          messageListener.remove();
                          messageListener = null;
                      }
                      showUsers();
                  });
                  content.addView(back);

                  TextView title = new TextView(this);
                  title.setText("Chat with " + activePeerName);
                  title.setTextSize(20);
                  title.setTextColor(Color.rgb(7, 94, 84));
                  content.addView(title);

   
